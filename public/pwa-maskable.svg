<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.9">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="45%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0c0518"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#ec4899" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.32" cy="0.22" r="0.95">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="boltGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <g transform="translate(256 256) scale(0.82) translate(-256 -256)" filter="url(#shadow)">
    <rect x="70" y="228" width="48" height="56" rx="16" fill="url(#bar)"/>
    <rect x="104" y="196" width="54" height="120" rx="20" fill="url(#plate)"/>
    <rect x="146" y="214" width="58" height="84" rx="20" fill="url(#plate)"/>
    <rect x="194" y="238" width="124" height="36" rx="18" fill="url(#bar)"/>
    <rect x="308" y="214" width="58" height="84" rx="20" fill="url(#plate)"/>
    <rect x="354" y="196" width="54" height="120" rx="20" fill="url(#plate)"/>
    <rect x="394" y="228" width="48" height="56" rx="16" fill="url(#bar)"/>
  </g>

  <g transform="translate(256 256) scale(0.82) translate(-256 -256)">
    <path
      filter="url(#boltGlow)"
      fill="#fde047"
      d="M276 186 L212 270 L252 270 L240 330 L312 244 L268 244 Z"
    />
  </g>

  <rect width="512" height="512" fill="url(#gloss)"/>
</svg>
